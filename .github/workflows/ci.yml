name: EDGE CI

on:
  push:
    paths:
      - "value/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "app.js"
  pull_request:
    paths:
      - "value/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "app.js"

jobs:
  browser-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse browser application
        run: node --check app.js
      - name: Reject duplicate core function definitions
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app.js','utf8');
          const required=['renderRadar','renderSavant','renderCapital','showView','syncRadar','syncCandidates','syncValue','tick'];
          for(const name of required){
            const re=new RegExp('(?:async\\\\s+)?function\\\\s+'+name+'\\\\s*\\\\(','g');
            const n=(s.match(re)||[]).length;
            if(n!==1){console.error(name+' definitions: '+n);process.exitCode=1;}
          }
          NODE
  value:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test VALUE invariants
        run: python -m unittest discover -s tests -v
      - name: Build VALUE queue from frozen RADAR snapshot
        run: python -m value.bridge --input radar/data/latest.json --output /tmp/value-latest.json
      - name: Build explicit corroboration graph
        run: python -m value.corroboration
      - name: Build explicit relationship graph
        run: python -m value.relationships
      - name: Freeze prospective VALUE laboratory state
        run: python -m value.lab