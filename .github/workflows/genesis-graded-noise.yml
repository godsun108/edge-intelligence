name: Genesis graded-noise development evaluation
on:
  workflow_dispatch:
  push:
    branches: [genesis-v36-audit-infrastructure]
    paths:
      - 'genesis-one/GRADED-NOISE-PROTOCOL.md'
      - 'genesis-one/replay-v35-tasks.cjs'
      - '.github/workflows/genesis-graded-noise.yml'
permissions:
  contents: read
jobs:
  graded-noise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate frozen v35 and graded shadow policies on fresh seeds
        run: node genesis-one/replay-v35-tasks.cjs seed=1300001 count=200 seedCount=4 > genesis-graded-noise.json
      - name: Validate task accounting and print comparison
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const r=require('./genesis-graded-noise.json');
          assert.equal(r.tasks,4000);
          assert.equal(r.mismatches,0);
          assert.equal(r.byScenario.length,20);
          assert.equal(r.accepted,r.correct+r.wrong);
          for(const name of ['baseline','noiseConsensus','medianHalf','medianOne']){
            const p=r.shadow[name];
            assert.ok(p,`missing ${name}`);
            assert.equal(p.accepted,p.correct+p.wrong);
            assert.ok(p.accepted<=r.accepted);
            console.log(name,JSON.stringify({...p,abstained:r.tasks-p.accepted,correctRejected:r.correct-p.correct,wrongPrevented:r.wrong-p.wrong}));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-graded-noise-development
          path: genesis-graded-noise.json
