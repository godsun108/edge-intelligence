name: Genesis uncertainty evaluation
on:
  push:
    branches: [genesis-v36-audit-infrastructure]
    paths:
      - '.github/workflows/genesis-uncertainty.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node genesis-one/replay-v35-tasks.cjs seed=2500001 count=200 seedCount=4 > uncertainty.json
      - run: node -e "const r=require('./uncertainty.json');if(r.tasks!==4000||r.mismatches)process.exit(1);console.log(JSON.stringify({baseline:r.shadow.baseline,gap2:r.shadow.uncertaintyGap2,gap4:r.shadow.uncertaintyGap4,requests:r.requests}))"
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-uncertainty-development
          path: uncertainty.json
