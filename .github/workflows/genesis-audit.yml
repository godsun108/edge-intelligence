name: Genesis ONE audit validator
on:
  pull_request:
    paths:
      - 'genesis-one/validate-v35-audit.cjs'
      - 'genesis-one/selftest-v35-audit.cjs'
      - '.github/workflows/genesis-audit.yml'
      - 'genesis-one/foundry-proof-preflight.cjs'
      - 'genesis-one/selftest-foundry-proof-preflight.cjs'
  push:
    branches: [main]
    paths:
      - 'genesis-one/validate-v35-audit.cjs'
      - 'genesis-one/selftest-v35-audit.cjs'
      - '.github/workflows/genesis-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check validator syntax
        run: node --check genesis-one/validate-v35-audit.cjs
      - name: Run validator positive and negative self-tests
        run: node genesis-one/selftest-v35-audit.cjs
      - name: Check Foundry proof preflight syntax
        run: |
          node --check genesis-one/foundry-proof-preflight.cjs
          node --check genesis-one/selftest-foundry-proof-preflight.cjs
      - name: Run Foundry proof ownership negative self-tests
        run: node genesis-one/selftest-foundry-proof-preflight.cjs
