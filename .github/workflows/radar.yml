name: EDGE RADAR
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: write
concurrency:
  group: edge-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python radar/ingest.py
      - name: Commit observation memory
        run: |
          git config user.name edge-radar
          git config user.email edge-radar@users.noreply.github.com
          git add radar/data
          git diff --cached --quiet || git commit -m "RADAR hourly observation memory"
          git push
