name: EDGE RADAR
on:
  workflow_dispatch:
  push:
    paths:
      - "radar/**"
      - ".github/workflows/radar.yml"
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: write
concurrency:
  group: edge-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m radar.ingest
      - name: Derive EDGE VALUE attention queue
        run: python -m value.bridge --input radar/data/latest.json --output value/data/latest.json
      - name: Build explicit corroboration graph
        run: python -m value.corroboration
      - name: Commit observation memory
        run: |
          git config user.name edge-radar
          git config user.email edge-radar@users.noreply.github.com
          git add radar/data value/data
          git diff --cached --quiet || git commit -m "RADAR hourly observation memory"
          git push
