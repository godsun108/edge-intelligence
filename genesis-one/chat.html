<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis Chat — Local Preview</title><style>body{margin:0;background:#0b1223;color:#e8efff;font:16px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:18px}h1{margin-bottom:4px}.muted{color:#a9bbda}#thread{height:60vh;overflow:auto;border:1px solid #405478;border-radius:16px;padding:16px;background:#18243d}.msg{margin:12px 0;padding:12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.you{background:#30476e}.genesis{background:#22334e}.label{font-size:12px;color:#b7d0ff}form{display:flex;gap:8px;margin-top:12px}input{flex:1;min-width:0;border-radius:12px;background:#18243d;color:white;border:1px solid #627ba4;padding:14px;font-size:16px}button{border:0;border-radius:12px;background:#94b9ff;color:#07142c;font-weight:700;padding:14px}a{color:#b7d0ff}</style></head><body><main><h1>Genesis Chat 🦾</h1><p class="muted">Offline local preview · experimental interface · no language model connected · no messages sent to a server</p><div id="thread" role="log" aria-live="polite"></div><form id="form"><input id="prompt" aria-label="Message" autocomplete="off" maxlength="2000" placeholder="Message Genesis…" required><button>Send</button></form><p class="muted">This preview does not claim general intelligence. It demonstrates the chat shell and capability disclosure. <a href="index.html">Open Genesis Lab</a></p></main><script>const thread=document.getElementById('thread'),form=document.getElementById('form'),input=document.getElementById('prompt');function add(who,body){const box=document.createElement('div');box.className='msg '+(who==='You'?'you':'genesis');const label=document.createElement('div');label.className='label';label.textContent=who;const text=document.createElement('div');text.textContent=body;box.append(label,text);thread.append(box);thread.scrollTop=thread.scrollHeight}add('Genesis · local preview','Welcome. This is the Genesis Chat interface preview. I cannot yet hold an open-ended conversation. The native Genesis research engine is being evaluated separately.');form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;add('You',value);input.value='';add('Genesis · local preview','Message received locally. General-chat inference is not connected yet. I will not invent an answer or imply an external model responded.');input.focus()});</script></body></html>
